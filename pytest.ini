[pytest]
testpaths = tests
python_files = conformance.py test_*.py
markers =
    stage1: CANDOR conformance tag (spec §6.7)
    stage2: CANDOR conformance tag (spec §6.7)
    stage3: CANDOR conformance tag (spec §6.7)
    stage4: CANDOR conformance tag (spec §6.7)
    stage5: CANDOR conformance tag (spec §6.7)
    fail_stop: invariant fail policy (spec §6.2)
    alert_only: invariant fail policy (spec §6.2)
    claims: public-claim validation on planted synthetic worlds (tests/claims)
    slow: prediction-heavy; excluded from `make claims-fast`
filterwarnings =
    ignore::DeprecationWarning
